name: Core API DB Migration

on:
  workflow_dispatch:
    inputs:
      target:
        description: 적용할 DB 환경
        required: true
        type: choice
        options:
          - preview
          - production
      confirm_target:
        description: 확인을 위해 target 값을 다시 입력하세요.
        required: true
        type: string
      confirm_commit:
        description: production 적용 시 master commit SHA 40자를 입력하세요.
        required: false
        default: ""
        type: string
      confirm_database_project_ref:
        description: 대상 Environment의 Supabase project ref를 다시 입력하세요.
        required: true
        type: string
      backup_reference:
        description: production 적용 시 복원 가능한 백업 증적 URL 또는 ID를 입력하세요.
        required: false
        default: ""
        type: string
      apply_companion_session_seed:
        description: preview 동행 세션 백필을 함께 적용합니다.
        required: false
        default: false
        type: boolean
      companion_session_seed_sha256:
        description: 백필 적용 시 생성 SQL의 SHA-256을 입력하세요.
        required: false
        default: ""
        type: string
      retention_fixture_action:
        description: preview 자동 파기 fixture 작업
        required: false
        default: none
        type: choice
        options:
          - none
          - setup
          - status
          - cleanup
      confirm_retention_fixture_project:
        description: fixture 작업 시 bodeul-dev를 입력하세요.
        required: false
        default: ""
        type: string
      guide_device_fixture_action:
        description: preview 가이드 실기기 fixture 작업
        required: false
        default: none
        type: choice
        options:
          - none
          - setup
          - status
          - cleanup
      confirm_guide_device_fixture_project:
        description: 가이드 실기기 fixture 작업 시 bodeul-dev를 입력하세요.
        required: false
        default: ""
        type: string
permissions:
  contents: read

concurrency:
  group: core-api-migration-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  migrate:
    name: migrate-${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: core-api-migration-${{ inputs.target }}

    defaults:
      run:
        working-directory: core-api

    env:
      MIGRATION_TARGET: ${{ inputs.target }}
      MIGRATION_CONFIRM_TARGET: ${{ inputs.confirm_target }}

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: 대상 확인
        shell: bash
        env:
          MIGRATION_CONFIRM_COMMIT: ${{ inputs.confirm_commit }}
          MIGRATION_CONFIRM_DATABASE_PROJECT_REF: ${{ inputs.confirm_database_project_ref }}
          MIGRATION_BACKUP_REFERENCE: ${{ inputs.backup_reference }}
          PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
          PREVIEW_SUPABASE_PROJECT_REF: ${{ vars.PREVIEW_SUPABASE_PROJECT_REF }}
          COMPANION_SESSION_SEED_SHA256: ${{ inputs.companion_session_seed_sha256 }}
          RETENTION_FIXTURE_ACTION: ${{ inputs.retention_fixture_action }}
          RETENTION_FIXTURE_CONFIRM_PROJECT: ${{ inputs.confirm_retention_fixture_project }}
          GUIDE_DEVICE_FIXTURE_ACTION: ${{ inputs.guide_device_fixture_action }}
          GUIDE_DEVICE_FIXTURE_CONFIRM_PROJECT: ${{ inputs.confirm_guide_device_fixture_project }}
        run: |
          set -euo pipefail

          if [ "$MIGRATION_TARGET" != "$MIGRATION_CONFIRM_TARGET" ]; then
            echo "입력한 target이 일치하지 않습니다."
            exit 1
          fi

          if [ "$MIGRATION_TARGET" = "production" ]; then
            if [ "$GITHUB_REF" != "refs/heads/master" ]; then
              echo "production migration은 master 브랜치에서만 실행할 수 있습니다." >&2
              exit 1
            fi

            if [ "$MIGRATION_CONFIRM_COMMIT" != "$GITHUB_SHA" ]; then
              echo "입력한 commit SHA와 workflow 실행 commit이 일치하지 않습니다." >&2
              exit 1
            fi

            if [[ ! "$PRODUCTION_SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]; then
              echo "Production Environment의 Supabase 프로젝트 확인값이 유효하지 않습니다." >&2
              exit 1
            fi

            if [ "$MIGRATION_CONFIRM_DATABASE_PROJECT_REF" != "$PRODUCTION_SUPABASE_PROJECT_REF" ]; then
              echo "Supabase 프로젝트 확인값이 일치하지 않습니다." >&2
              exit 1
            fi

            if [ -z "$MIGRATION_BACKUP_REFERENCE" ]; then
              echo "production migration에는 복원 가능한 백업 증적이 필요합니다." >&2
              exit 1
            fi

            if [[ ! "$MIGRATION_BACKUP_REFERENCE" =~ ^[A-Za-z0-9._:/#=-]+$ ]]; then
              echo "백업 증적에는 URL 또는 안전한 식별자만 입력할 수 있습니다." >&2
              exit 1
            fi
          elif [ "$MIGRATION_TARGET" = "preview" ]; then
            if [ "$GITHUB_REF" != "refs/heads/dev" ] || [ "$PREVIEW_SUPABASE_PROJECT_REF" != "parpdzttloacinyvhwmx" ] || [ "$MIGRATION_CONFIRM_DATABASE_PROJECT_REF" != "$PREVIEW_SUPABASE_PROJECT_REF" ]; then
              echo "개발 migration은 dev 브랜치와 개발 Supabase 프로젝트가 일치해야 합니다." >&2
              exit 1
            fi
          else
            echo "허용하지 않은 migration 대상입니다." >&2
            exit 1
          fi

          if [ "${{ inputs.apply_companion_session_seed }}" = "true" ]; then
            if [ "$MIGRATION_TARGET" != "preview" ] || [ "$GITHUB_REF" != "refs/heads/dev" ]; then
              echo "동행 세션 백필은 dev의 preview migration에서만 실행할 수 있습니다." >&2
              exit 1
            fi
            if [[ ! "$COMPANION_SESSION_SEED_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "동행 세션 백필 SHA-256을 확인해 주세요." >&2
              exit 1
            fi
          fi

          if [ "$RETENTION_FIXTURE_ACTION" != "none" ]; then
            if [ "$MIGRATION_TARGET" != "preview" ] || [ "$GITHUB_REF" != "refs/heads/dev" ]; then
              echo "자동 파기 fixture는 dev의 preview DB에서만 실행할 수 있습니다." >&2
              exit 1
            fi
            if [ "$RETENTION_FIXTURE_CONFIRM_PROJECT" != "bodeul-dev" ]; then
              echo "자동 파기 fixture 프로젝트 확인값이 일치하지 않습니다." >&2
              exit 1
            fi
            if [ "${{ inputs.apply_companion_session_seed }}" = "true" ]; then
              echo "동행 세션 백필과 자동 파기 fixture를 같은 실행에서 적용할 수 없습니다." >&2
              exit 1
            fi
          fi

          if [ "$GUIDE_DEVICE_FIXTURE_ACTION" != "none" ]; then
            if [ "$MIGRATION_TARGET" != "preview" ] || [ "$GITHUB_REF" != "refs/heads/dev" ]; then
              echo "가이드 실기기 fixture는 dev의 preview DB에서만 실행할 수 있습니다." >&2
              exit 1
            fi
            if [ "$GUIDE_DEVICE_FIXTURE_CONFIRM_PROJECT" != "bodeul-dev" ]; then
              echo "가이드 실기기 fixture 프로젝트 확인값이 일치하지 않습니다." >&2
              exit 1
            fi
            if [ "${{ inputs.apply_companion_session_seed }}" = "true" ] || [ "$RETENTION_FIXTURE_ACTION" != "none" ]; then
              echo "가이드 실기기 fixture는 다른 fixture 또는 seed와 같은 실행에서 적용할 수 없습니다." >&2
              exit 1
            fi
          fi

      - name: migration secret 확인
        shell: bash
        env:
          MIGRATION_DB_JDBC_URL: ${{ secrets.MIGRATION_DB_JDBC_URL }}
          MIGRATION_DB_USERNAME: ${{ secrets.MIGRATION_DB_USERNAME }}
          MIGRATION_DB_PASSWORD: ${{ secrets.MIGRATION_DB_PASSWORD }}
        run: |
          if [ -z "$MIGRATION_DB_JDBC_URL" ] || [ -z "$MIGRATION_DB_USERNAME" ] || [ -z "$MIGRATION_DB_PASSWORD" ]; then
            echo "migration Environment secret이 준비되지 않았습니다."
            exit 1
          fi

      - name: 동행 세션 백필 secret 확인
        if: inputs.apply_companion_session_seed
        shell: bash
        env:
          COMPANION_SESSION_SEED_SQL_BASE64: ${{ secrets.COMPANION_SESSION_SEED_SQL_BASE64 }}
        run: |
          if [ -z "$COMPANION_SESSION_SEED_SQL_BASE64" ]; then
            echo "동행 세션 백필 일회성 secret이 준비되지 않았습니다."
            exit 1
          fi

      - name: 가이드 실기기 fixture secret 확인
        if: inputs.guide_device_fixture_action == 'setup'
        shell: bash
        env:
          GUIDE_DEVICE_FIXTURE_MANAGER_FIREBASE_UID: ${{ secrets.GUIDE_DEVICE_FIXTURE_MANAGER_FIREBASE_UID }}
        run: |
          if [[ ! "$GUIDE_DEVICE_FIXTURE_MANAGER_FIREBASE_UID" =~ ^[A-Za-z0-9_-]{1,128}$ ]]; then
            echo "가이드 실기기 fixture 매니저 UID secret이 준비되지 않았습니다." >&2
            exit 1
          fi

      - name: Java 21 설정
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Gradle Wrapper 검증
        uses: gradle/actions/wrapper-validation@v6

      - name: Core API 검증
        run: ./gradlew check --console=plain

      - name: 환경별 DB 연결 대상 검증
        env:
          EXPECTED_SUPABASE_PROJECT_REF: ${{ inputs.target == 'production' && vars.PRODUCTION_SUPABASE_PROJECT_REF || vars.PREVIEW_SUPABASE_PROJECT_REF }}
          MIGRATION_DB_JDBC_URL: ${{ secrets.MIGRATION_DB_JDBC_URL }}
          MIGRATION_DB_USERNAME: ${{ secrets.MIGRATION_DB_USERNAME }}
        run: ./gradlew verifyDatabaseConnectionTarget --console=plain

      - name: Flyway migration 실행
        env:
          MIGRATION_DB_JDBC_URL: ${{ secrets.MIGRATION_DB_JDBC_URL }}
          MIGRATION_DB_USERNAME: ${{ secrets.MIGRATION_DB_USERNAME }}
          MIGRATION_DB_PASSWORD: ${{ secrets.MIGRATION_DB_PASSWORD }}
        run: ./gradlew migrateDatabase --console=plain

      - name: 계정 삭제 영향도 DB 계약 검증
        env:
          MIGRATION_DB_JDBC_URL: ${{ secrets.MIGRATION_DB_JDBC_URL }}
          MIGRATION_DB_USERNAME: ${{ secrets.MIGRATION_DB_USERNAME }}
          MIGRATION_DB_PASSWORD: ${{ secrets.MIGRATION_DB_PASSWORD }}
        run: ./gradlew verifyAccountDeletionInventory --console=plain

      - name: 동행 세션 백필 파일 준비
        if: inputs.apply_companion_session_seed
        shell: bash
        env:
          COMPANION_SESSION_SEED_SQL_BASE64: ${{ secrets.COMPANION_SESSION_SEED_SQL_BASE64 }}
          COMPANION_SESSION_SEED_SHA256: ${{ inputs.companion_session_seed_sha256 }}
        run: |
          set -euo pipefail
          seed_file="${RUNNER_TEMP}/companion-session-seed.sql"
          printf '%s' "$COMPANION_SESSION_SEED_SQL_BASE64" | base64 --decode > "$seed_file"
          chmod 600 "$seed_file"
          actual_sha256="$(sha256sum "$seed_file" | cut -d' ' -f1)"
          if [ "$actual_sha256" != "${COMPANION_SESSION_SEED_SHA256,,}" ]; then
            echo "동행 세션 백필 파일 SHA-256이 입력값과 일치하지 않습니다." >&2
            exit 1
          fi

      - name: 동행 세션 백필 실행
        if: inputs.apply_companion_session_seed
        env:
          COMPANION_SESSION_SEED_SQL_FILE: ${{ runner.temp }}/companion-session-seed.sql
          MIGRATION_DB_JDBC_URL: ${{ secrets.MIGRATION_DB_JDBC_URL }}
          MIGRATION_DB_USERNAME: ${{ secrets.MIGRATION_DB_USERNAME }}
          MIGRATION_DB_PASSWORD: ${{ secrets.MIGRATION_DB_PASSWORD }}
        run: ./gradlew applyCompanionSessionSeed --console=plain

      - name: 자동 파기 fixture 실행
        if: inputs.retention_fixture_action != 'none'
        env:
          RETENTION_FIXTURE_ACTION: ${{ inputs.retention_fixture_action }}
          RETENTION_FIXTURE_CONFIRM_PROJECT: ${{ inputs.confirm_retention_fixture_project }}
          MIGRATION_DB_JDBC_URL: ${{ secrets.MIGRATION_DB_JDBC_URL }}
          MIGRATION_DB_USERNAME: ${{ secrets.MIGRATION_DB_USERNAME }}
          MIGRATION_DB_PASSWORD: ${{ secrets.MIGRATION_DB_PASSWORD }}
        run: ./gradlew runRetentionFixture --console=plain

      - name: 가이드 실기기 fixture 실행
        if: inputs.guide_device_fixture_action != 'none'
        env:
          GUIDE_DEVICE_FIXTURE_ACTION: ${{ inputs.guide_device_fixture_action }}
          GUIDE_DEVICE_FIXTURE_CONFIRM_PROJECT: ${{ inputs.confirm_guide_device_fixture_project }}
          GUIDE_DEVICE_FIXTURE_MANAGER_FIREBASE_UID: ${{ secrets.GUIDE_DEVICE_FIXTURE_MANAGER_FIREBASE_UID }}
          MIGRATION_DB_JDBC_URL: ${{ secrets.MIGRATION_DB_JDBC_URL }}
          MIGRATION_DB_USERNAME: ${{ secrets.MIGRATION_DB_USERNAME }}
          MIGRATION_DB_PASSWORD: ${{ secrets.MIGRATION_DB_PASSWORD }}
        run: ./gradlew runGuideDeviceFixture --console=plain

      - name: 동행 세션 백필 파일 삭제
        if: always() && inputs.apply_companion_session_seed
        shell: bash
        run: rm -f "${RUNNER_TEMP}/companion-session-seed.sql"

      - name: migration 결과 기록
        shell: bash
        env:
          MIGRATION_BACKUP_REFERENCE: ${{ inputs.backup_reference }}
        run: |
          {
            echo "## Core API DB Migration"
            echo
            echo "- Target: ${MIGRATION_TARGET}"
            echo "- Commit: ${GITHUB_SHA}"
            if [ "$MIGRATION_TARGET" = "production" ]; then
              echo "- Backup: ${MIGRATION_BACKUP_REFERENCE}"
            fi
            if [ "${{ inputs.apply_companion_session_seed }}" = "true" ]; then
              echo "- Companion session seed: applied"
              echo "- Seed SHA-256: ${{ inputs.companion_session_seed_sha256 }}"
            fi
            if [ "${{ inputs.retention_fixture_action }}" != "none" ]; then
              echo "- Retention fixture: ${{ inputs.retention_fixture_action }}"
              echo "- Retention fixture project: bodeul-dev"
            fi
            if [ "${{ inputs.guide_device_fixture_action }}" != "none" ]; then
              echo "- Guide device fixture: ${{ inputs.guide_device_fixture_action }}"
              echo "- Guide device fixture project: bodeul-dev"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
