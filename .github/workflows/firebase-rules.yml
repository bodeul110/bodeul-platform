name: Firebase Rules

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - "tools/firebase/package.json"
      - "tools/firebase/package-lock.json"
      - "tools/firebase/rules-emulator-tests/**"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "functions/src/retention.js"
      - "functions/scripts/lib/retention-firebase-fixture.js"
      - "functions/scripts/run-retention-firebase-fixture.js"
      - "functions/scripts/run-retention-firebase-production-fixture.js"
      - "functions/scripts/run-retention-emulator-tests.js"
      - "functions/test/retention-emulator.test.js"
      - "functions/test/retention-firebase-fixture.test.js"
      - "functions/test/retention-firebase-production-fixture.test.js"
      - ".github/workflows/firebase-rules.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    name: emulator-rules-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Node.js 설정
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            tools/firebase/package-lock.json
            functions/package-lock.json

      - name: JDK 21 설정
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Firebase 도구 의존성 설치
        working-directory: tools/firebase
        run: npm ci

      - name: Functions 의존성 설치
        working-directory: functions
        run: npm ci

      - name: Firestore/Storage Rules emulator 테스트
        working-directory: tools/firebase
        run: npm run test:rules

      - name: 파기 Firestore/Storage emulator 테스트
        working-directory: functions
        run: npm run test:retention:emulator
