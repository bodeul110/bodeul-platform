name: Firebase Rules

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "storage.rules"
      - "firebase.json"
      - "tools/firebase/package.json"
      - "tools/firebase/package-lock.json"
      - "tools/firebase/rules-emulator-tests/**"
      - "functions/package.json"
      - "functions/package-lock.json"
      - "functions/src/retention.js"
      - "functions/scripts/lib/retention-firebase-fixture.js"
      - "functions/scripts/run-retention-firebase-fixture.js"
      - "functions/scripts/run-retention-firebase-production-fixture.js"
      - "functions/scripts/run-retention-emulator-tests.js"
      - "functions/test/retention-emulator.test.js"
      - "functions/test/retention-firebase-fixture.test.js"
      - "functions/test/retention-firebase-production-fixture.test.js"
      - ".github/workflows/firebase-rules.yml"
      - "tools/firebase/retention-preview-deploy.js"
      - "tools/firebase/test/retention-preview-deploy.test.js"
      - "tools/firebase/iam/*retention-preview-boundaries.ps1"
  workflow_dispatch:
    inputs:
      deploy_retention_preview:
        description: "개발 cleanupExpiredData만 삭제 없는 집계 모드로 배포"
        required: false
        default: false
        type: boolean
      confirm_dev_sha:
        description: "배포할 때만 검토한 dev 커밋 SHA 40자를 입력하세요"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.deploy_retention_preview && 'retention-preview-deploy' || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !inputs.deploy_retention_preview }}

jobs:
  rules:
    name: emulator-rules-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Node.js 설정
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            tools/firebase/package-lock.json
            functions/package-lock.json

      - name: JDK 21 설정
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Firebase 도구 의존성 설치
        working-directory: tools/firebase
        run: npm ci

      - name: Functions 의존성 설치
        working-directory: functions
        run: npm ci

      - name: Firestore/Storage Rules emulator 테스트
        working-directory: tools/firebase
        run: npm run test:rules

      - name: 파기 Firestore/Storage emulator 테스트
        working-directory: functions
        run: npm run test:retention:emulator

      - name: Functions와 개발 배포 경계 테스트
        run: |
          npm --prefix functions test
          node --test tools/firebase/test/retention-preview-deploy.test.js

      - name: IAM 준비 스크립트 오프라인 테스트
        shell: pwsh
        run: ./tools/firebase/iam/test-retention-preview-boundaries.ps1

  retention-boundary:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_retention_preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: 승인 환경이 이미 존재하는지 확인
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM_DEV_SHA: ${{ inputs.confirm_dev_sha }}
        run: node tools/firebase/retention-preview-deploy.js guard

  deploy-guarded-retention:
    needs: [rules, retention-boundary]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_retention_preview && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: firebase-retention-preview
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      CONFIRM_DEV_SHA: ${{ inputs.confirm_dev_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: 승인 후 dev와 실행 경계 재확인
        run: node tools/firebase/retention-preview-deploy.js guard
      - name: 개발 보관 함수 전용 WIF 인증
        id: google
        uses: google-github-actions/auth@v3
        with:
          project_id: bodeul-dev
          workload_identity_provider: projects/533563500316/locations/global/workloadIdentityPools/github-actions/providers/bodeul-retention-dev
          service_account: bodeul-retention-dev-deploy@bodeul-dev.iam.gserviceaccount.com
          create_credentials_file: false
          export_environment_variables: false
          token_format: access_token
          access_token_lifetime: 1800s
      - name: 기존 개발 함수의 소스와 집계 설정만 갱신
        env:
          RETENTION_DEPLOY_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
        run: node tools/firebase/retention-preview-deploy.js deploy
