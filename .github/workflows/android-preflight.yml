name: Android Preflight

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:
    inputs:
      require_firebase_ops:
        description: "Firebase 운영 점검을 필수로 실행할지 여부"
        required: false
        default: false
        type: boolean
      backup_file:
        description: "비교용 백업 파일 경로"
        required: false
        default: ""
        type: string
      app_evidence_path:
        description: "앱 화면 증적 파일 경로"
        required: false
        default: "tools/firebase/templates/app-navigation-evidence.sample.json"
        type: string
      runner_profile:
        description: "프리플라이트 실행기 종류"
        required: false
        default: "github-hosted"
        type: choice
        options:
          - github-hosted
          - self-hosted-bodeul

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_profile == 'self-hosted-bodeul' && fromJSON('["self-hosted","bodeul","preflight"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
      FIREBASE_CI_SERVICE_ACCOUNT: ${{ vars.FIREBASE_CI_SERVICE_ACCOUNT }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      FIREBASERC_JSON: ${{ secrets.FIREBASERC_JSON }}
      BODEUL_REQUIRE_FIREBASE: ${{ github.event_name == 'workflow_dispatch' && inputs.require_firebase_ops || 'false' }}
      BODEUL_BACKUP_FILE: ${{ github.event_name == 'workflow_dispatch' && inputs.backup_file || '' }}
      BODEUL_APP_EVIDENCE_PATH: ${{ github.event_name == 'workflow_dispatch' && inputs.app_evidence_path || 'tools/firebase/templates/app-navigation-evidence.sample.json' }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 변경 범위 분류
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          changed_file="$(mktemp)"
          android=false
          functions=false
          firebase_tools=false
          docs_only=true
          unknown=false

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_file"; then
              git fetch --no-tags --depth=1 origin "$BASE_REF"
              git diff --name-only "origin/$BASE_REF"...HEAD > "$changed_file"
            fi
          else
            printf '%s\n' "__workflow_dispatch__" > "$changed_file"
            android=true
            functions=true
            firebase_tools=true
            docs_only=false
          fi

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                app/*|build.gradle.kts|settings.gradle.kts|gradle.properties|gradlew|gradlew.bat|gradle/*)
                  android=true
                  docs_only=false
                  ;;
                functions/*)
                  functions=true
                  docs_only=false
                  ;;
                tools/firebase/*|firebase.json|firestore.rules|storage.rules|.firebaserc)
                  firebase_tools=true
                  docs_only=false
                  ;;
                .github/workflows/*)
                  android=true
                  functions=true
                  firebase_tools=true
                  docs_only=false
                  ;;
                .github/*)
                  firebase_tools=true
                  docs_only=false
                  ;;
                docs/*|README.md|AGENTS.md|design_refs/*)
                  ;;
                *)
                  android=true
                  functions=true
                  firebase_tools=true
                  docs_only=false
                  unknown=true
                  ;;
              esac
            done < "$changed_file"
          fi

          {
            echo "android=$android"
            echo "functions=$functions"
            echo "firebase_tools=$firebase_tools"
            echo "docs_only=$docs_only"
            echo "unknown=$unknown"
          } >> "$GITHUB_OUTPUT"

          echo "변경 파일"
          sed 's/^/- /' "$changed_file"
          echo "검증 범위"
          echo "- Android: $android"
          echo "- functions: $functions"
          echo "- Firebase tools: $firebase_tools"
          echo "- 문서 전용: $docs_only"
          echo "- 미분류 파일 포함: $unknown"

      - name: JDK 17 설정
        if: steps.scope.outputs.android == 'true' && (github.event_name != 'workflow_dispatch' || inputs.runner_profile != 'self-hosted-bodeul')
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: JDK 17 설정 (self-hosted)
        if: steps.scope.outputs.android == 'true' && github.event_name == 'workflow_dispatch' && inputs.runner_profile == 'self-hosted-bodeul'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Node.js 설정
        if: steps.scope.outputs.android == 'true' || steps.scope.outputs.functions == 'true' || steps.scope.outputs.firebase_tools == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json

      - name: Android SDK 경로 설정 (self-hosted)
        if: steps.scope.outputs.android == 'true' && github.event_name == 'workflow_dispatch' && inputs.runner_profile == 'self-hosted-bodeul'
        env:
          SELF_HOSTED_ANDROID_HOME: ${{ vars.SELF_HOSTED_ANDROID_HOME }}
        run: |
          if [ -z "$SELF_HOSTED_ANDROID_HOME" ]; then
            echo "SELF_HOSTED_ANDROID_HOME 저장소 변수가 비어 있습니다." >&2
            exit 1
          fi

          sdk_path="$SELF_HOSTED_ANDROID_HOME"
          sdk_check_path="$sdk_path"
          if command -v cygpath >/dev/null 2>&1; then
            sdk_check_path="$(cygpath -u "$sdk_path")"
          fi

          if [ ! -d "$sdk_check_path" ]; then
            echo "Android SDK 경로가 없습니다: $sdk_path" >&2
            exit 1
          fi

          {
            printf 'ANDROID_HOME=%s\n' "$sdk_path"
            printf 'ANDROID_SDK_ROOT=%s\n' "$sdk_path"
          } >> "$GITHUB_ENV"

      - name: Gradle 실행 권한 부여
        if: steps.scope.outputs.android == 'true'
        run: chmod +x gradlew

      - name: google-services.json 복원
        if: steps.scope.outputs.android == 'true' && env.GOOGLE_SERVICES_JSON != ''
        shell: bash
        run: |
          mkdir -p app
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Android 릴리스 App Check provider 경계 확인
        if: steps.scope.outputs.android == 'true'
        run: ./gradlew :app:verifyReleaseAppCheckClasspath --console=plain

      - name: Android 개발·운영 설정 혼합 차단 검사
        if: steps.scope.outputs.android == 'true'
        run: node tools/android/check-environment-boundary.mjs

      - name: 인프라 감사 도구 단위 테스트
        if: steps.scope.outputs.firebase_tools == 'true'
        run: node --test tools/gcp/test/*.test.mjs

      - name: .firebaserc 복원
        if: steps.scope.outputs.firebase_tools == 'true' && env.FIREBASERC_JSON != ''
        shell: bash
        run: |
          printf '%s' "$FIREBASERC_JSON" > .firebaserc

      - name: Firebase WIF 설정 확인
        if: github.event_name == 'workflow_dispatch' && inputs.require_firebase_ops
        shell: bash
        run: |
          set -euo pipefail

          expected_project_id="bodeul-dev"
          expected_provider="projects/533563500316/locations/global/workloadIdentityPools/github-actions/providers/bodeul-firebase-preflight"
          expected_service_account="bodeul-firebase-preflight@bodeul-dev.iam.gserviceaccount.com"

          if [ "$GITHUB_REF" != "refs/heads/dev" ]; then
            echo "개발 Firebase 운영 점검은 dev 브랜치에서만 실행합니다." >&2
            exit 1
          fi

          if [ "$FIREBASE_PROJECT_ID" != "$expected_project_id" ]; then
            echo "Firebase 프로젝트 설정이 예상 값과 다릅니다." >&2
            exit 1
          fi
          if [ "$FIREBASE_WORKLOAD_IDENTITY_PROVIDER" != "$expected_provider" ]; then
            echo "Firebase WIF provider 설정이 예상 값과 다릅니다." >&2
            exit 1
          fi
          if [ "$FIREBASE_CI_SERVICE_ACCOUNT" != "$expected_service_account" ]; then
            echo "Firebase CI 서비스 계정 설정이 예상 값과 다릅니다." >&2
            exit 1
          fi

      - name: Firebase WIF 인증
        id: firebase-auth
        if: github.event_name == 'workflow_dispatch' && inputs.require_firebase_ops
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ env.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.FIREBASE_CI_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 1800s

      - name: Android 프리플라이트 실행
        if: steps.scope.outputs.android == 'true'
        shell: bash
        env:
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.firebase-auth.outputs.access_token }}
        run: |
          ARGS=()
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            # PR과 dev push는 외부 운영 상태 대신 앱 빌드와 테스트 안정성만 확인한다.
            ARGS+=(--skip-workflow)
          fi
          if [ -n "$BODEUL_BACKUP_FILE" ]; then
            ARGS+=(--file "$BODEUL_BACKUP_FILE")
          fi
          if [ -n "$BODEUL_APP_EVIDENCE_PATH" ]; then
            ARGS+=(--app-evidence "$BODEUL_APP_EVIDENCE_PATH")
          fi
          if [ "$BODEUL_REQUIRE_FIREBASE" = "true" ]; then
            ARGS+=(--require-firebase)
          fi
          node tools/firebase/run-ci-preflight.js "${ARGS[@]}"

      - name: Functions 의존성 확인
        if: steps.scope.outputs.functions == 'true'
        working-directory: functions
        run: npm ci

      - name: Functions 테스트
        if: steps.scope.outputs.functions == 'true'
        working-directory: functions
        run: npm test

      - name: Firebase 도구 점검
        if: steps.scope.outputs.firebase_tools == 'true'
        shell: bash
        run: |
          find tools/firebase -name "*.js" -print0 | xargs -0 -n 1 node --check
          node tools/firebase/run-ci-preflight.js --skip-workflow --skip-build --skip-tests --summary tools/firebase/reports/firebase-tools-light-preflight

      - name: CI 범위 요약 작성
        if: always()
        shell: bash
        run: |
          mkdir -p tools/firebase/reports
          {
            echo "# BoDeul CI 범위 요약"
            echo ""
            echo "- 실행기: ${{ github.event_name == 'workflow_dispatch' && inputs.runner_profile || 'github-hosted' }}"
            echo "- Android: ${{ steps.scope.outputs.android }}"
            echo "- functions: ${{ steps.scope.outputs.functions }}"
            echo "- Firebase tools: ${{ steps.scope.outputs.firebase_tools }}"
            echo "- 문서 전용: ${{ steps.scope.outputs.docs_only }}"
            echo "- 미분류 파일 포함: ${{ steps.scope.outputs.unknown }}"
          } > tools/firebase/reports/ci-scope-summary.md

      - name: 운영 리포트 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bodeul-preflight-reports
          path: tools/firebase/reports/
          if-no-files-found: warn
