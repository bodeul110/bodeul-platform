name: Core API CI

on:
  pull_request:
    paths:
      - "core-api/**"
      - "firebase.json"
      - "tools/firebase/package.json"
      - "tools/firebase/package-lock.json"
      - "tools/firebase/run-core-api-firestore-emulator-tests.js"
      - ".github/workflows/core-api.yml"
      - ".github/workflows/core-api-preview-deploy.yml"
      - ".github/workflows/core-api-production-deploy.yml"
      - ".github/workflows/core-api-migration.yml"
  push:
    branches:
      - master
      - dev
    paths:
      - "core-api/**"
      - "firebase.json"
      - "tools/firebase/package.json"
      - "tools/firebase/package-lock.json"
      - "tools/firebase/run-core-api-firestore-emulator-tests.js"
      - ".github/workflows/core-api.yml"
      - ".github/workflows/core-api-preview-deploy.yml"
      - ".github/workflows/core-api-production-deploy.yml"
      - ".github/workflows/core-api-migration.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: core-api

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Gradle Wrapper 검증
        uses: gradle/actions/wrapper-validation@v6

      - name: Java 21 설정
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Core API 검증
        run: ./gradlew check --console=plain

      - name: Cloud Run 컨테이너 빌드 검증
        working-directory: ${{ github.workspace }}
        run: docker build --tag bodeul-core-api:ci ./core-api

  firestore-emulator:
    name: firestore-emulator
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Gradle Wrapper 검증
        uses: gradle/actions/wrapper-validation@v6

      - name: Java 21 설정
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Node.js 22 설정
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/firebase/package-lock.json

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Firebase 도구 설치
        run: npm ci --prefix tools/firebase

      - name: 계정 영향도 Firestore Emulator 검증
        run: npm --prefix tools/firebase run test:core-api-firestore-emulator

  migration-contract:
    name: migration-contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: core-api

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: Gradle Wrapper 검증
        uses: gradle/actions/wrapper-validation@v6

      - name: Java 21 설정
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: 동행 가이드 migration 연속 적용과 rollback 검증
        env:
          PGPASSWORD: postgres
        run: bash db/verification/verify_companion_guide_snapshot_migration.sh

      - name: 보호자 동의 V17 적용과 안전 rollback 검증
        env:
          PGPASSWORD: postgres
        run: bash db/verification/verify_guardian_sharing_consent_migration.sh

      - name: 동행 종료 V18 적용, 기능 제약과 fail-closed rollback 검증
        env:
          PGPASSWORD: postgres
        run: bash db/verification/verify_companion_completion_migration.sh

      - name: 무통장입금 V22 상태, 권한, 멱등성과 fail-closed rollback 검증
        env:
          PGPASSWORD: postgres
        run: bash db/verification/verify_bank_transfer_payment_migration.sh

      - name: 보호자 예약 승인 V24 저장, 동시성, 권한과 안전 rollback 검증
        env:
          PGPASSWORD: postgres
        run: bash db/verification/verify_guardian_booking_approval_migration.sh
