name: Core API Preview Deploy

on:
  push:
    branches: [dev]
    paths:
      - "core-api/**"
      - ".github/workflows/core-api.yml"
      - ".github/workflows/core-api-preview-deploy.yml"
  workflow_dispatch:
    inputs:
      confirm_service:
        description: "배포 대상 확인을 위해 bodeul-core-api-preview를 입력하세요"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: core-api-preview-deploy
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'bodeul110/bodeul-platform' && github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/core-api.yml
    permissions:
      contents: read

  deploy-preview:
    name: deploy-preview
    runs-on: ubuntu-latest
    environment: core-api-preview
    timeout-minutes: 30
    needs: validate
    permissions:
      contents: read
      id-token: write
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE }}
      CLOUD_RUN_ARTIFACT_REPOSITORY: ${{ vars.CLOUD_RUN_ARTIFACT_REPOSITORY }}
      CLOUD_RUN_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.CLOUD_RUN_WORKLOAD_IDENTITY_PROVIDER }}
      CLOUD_RUN_DEPLOY_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_DEPLOY_SERVICE_ACCOUNT }}
      CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT: ${{ vars.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
      CORE_DB_JDBC_URL_SECRET_VERSION: ${{ vars.CORE_DB_JDBC_URL_SECRET_VERSION }}
      CORE_DB_USERNAME_SECRET_VERSION: ${{ vars.CORE_DB_USERNAME_SECRET_VERSION }}
      CORE_DB_PASSWORD_SECRET_VERSION: ${{ vars.CORE_DB_PASSWORD_SECRET_VERSION }}
      KAKAO_LOCAL_REST_API_KEY_SECRET_VERSION: ${{ vars.KAKAO_LOCAL_REST_API_KEY_SECRET_VERSION }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_PROJECT_NUMBER: ${{ vars.FIREBASE_PROJECT_NUMBER }}
      BODEUL_SESSION_PRE_CONSULTATION_ENFORCEMENT: ${{ vars.BODEUL_SESSION_PRE_CONSULTATION_ENFORCEMENT || 'false' }}
      BODEUL_SESSION_COMPLETION_ENFORCEMENT: ${{ vars.BODEUL_SESSION_COMPLETION_ENFORCEMENT || 'false' }}
      BODEUL_SESSION_LEGACY_MANAGER_LOCATION_ENABLED: ${{ vars.BODEUL_SESSION_LEGACY_MANAGER_LOCATION_ENABLED || 'false' }}

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v7

      - name: 배포 대상과 설정 확인
        id: config
        shell: bash
        env:
          CONFIRM_SERVICE: ${{ inputs.confirm_service }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" != "refs/heads/dev" ]]; then
            echo "Core API preview는 dev 브랜치에서만 배포할 수 있습니다." >&2
            exit 1
          fi

          if [[ "$GCP_PROJECT_ID" != "bodeul-dev" || "$FIREBASE_PROJECT_ID" != "bodeul-dev" || "$FIREBASE_PROJECT_NUMBER" != "533563500316" || "$GCP_REGION" != "asia-northeast1" ]]; then
            echo "개발 GCP/Firebase 프로젝트와 리전이 일치하지 않습니다." >&2
            exit 1
          fi

          required_variables=(
            GCP_PROJECT_ID
            GCP_REGION
            CLOUD_RUN_SERVICE
            CLOUD_RUN_ARTIFACT_REPOSITORY
            CLOUD_RUN_WORKLOAD_IDENTITY_PROVIDER
            CLOUD_RUN_DEPLOY_SERVICE_ACCOUNT
            CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT
            CORE_DB_JDBC_URL_SECRET_VERSION
            CORE_DB_USERNAME_SECRET_VERSION
            CORE_DB_PASSWORD_SECRET_VERSION
            KAKAO_LOCAL_REST_API_KEY_SECRET_VERSION
            FIREBASE_PROJECT_ID
            FIREBASE_PROJECT_NUMBER
          )

          for variable_name in "${required_variables[@]}"; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "${variable_name} Environment variable이 비어 있습니다." >&2
              exit 1
            fi
          done

          if [[ "${CLOUD_RUN_SERVICE}" != "bodeul-core-api-preview" ]]; then
            echo "허용된 preview 서비스명이 아닙니다: ${CLOUD_RUN_SERVICE}" >&2
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "${CONFIRM_SERVICE}" != "${CLOUD_RUN_SERVICE}" ]]; then
            echo "입력한 서비스명과 실제 배포 대상이 일치하지 않습니다." >&2
            exit 1
          fi

          secret_versions=(
            CORE_DB_JDBC_URL_SECRET_VERSION
            CORE_DB_USERNAME_SECRET_VERSION
            CORE_DB_PASSWORD_SECRET_VERSION
            KAKAO_LOCAL_REST_API_KEY_SECRET_VERSION
          )

          for variable_name in "${secret_versions[@]}"; do
            if [[ ! "${!variable_name}" =~ ^[1-9][0-9]*$ ]]; then
              echo "${variable_name}은 1 이상의 숫자여야 합니다." >&2
              exit 1
            fi
          done

          if [[ "${BODEUL_SESSION_PRE_CONSULTATION_ENFORCEMENT}" != "false" && "${BODEUL_SESSION_PRE_CONSULTATION_ENFORCEMENT}" != "true" ]]; then
            echo "진료 전 확인 서버 차단 설정은 false 또는 true여야 합니다." >&2
            exit 1
          fi

          if [[ "${BODEUL_SESSION_COMPLETION_ENFORCEMENT}" != "false" && "${BODEUL_SESSION_COMPLETION_ENFORCEMENT}" != "true" ]]; then
            echo "동행 종료·완료 분리 강제 설정은 false 또는 true여야 합니다." >&2
            exit 1
          fi

          if [[ "${BODEUL_SESSION_LEGACY_MANAGER_LOCATION_ENABLED}" != "false" && "${BODEUL_SESSION_LEGACY_MANAGER_LOCATION_ENABLED}" != "true" ]]; then
            echo "Preview의 기존 매니저 위치 공유 설정은 false 또는 true여야 합니다." >&2
            exit 1
          fi

          registry="${GCP_REGION}-docker.pkg.dev"
          image="${registry}/${GCP_PROJECT_ID}/${CLOUD_RUN_ARTIFACT_REPOSITORY}/bodeul-core-api"

          echo "registry=${registry}" >> "${GITHUB_OUTPUT}"
          echo "image=${image}" >> "${GITHUB_OUTPUT}"

      - name: Gradle Wrapper 검증
        uses: gradle/actions/wrapper-validation@v6

      - name: Java 21 설정
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Core API 검증
        working-directory: core-api
        run: ./gradlew check --console=plain

      - name: Google Cloud WIF 인증
        id: gcp-auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.CLOUD_RUN_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.CLOUD_RUN_DEPLOY_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Artifact Registry 로그인
        uses: docker/login-action@v4
        with:
          registry: ${{ steps.config.outputs.registry }}
          username: oauth2accesstoken
          password: ${{ steps.gcp-auth.outputs.access_token }}

      - name: Google Cloud CLI 설정
        uses: google-github-actions/setup-gcloud@v3

      - name: 기존 개발 트래픽 확인
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format=json > previous-service.json
          revision="$(jq -r '[.status.traffic[] | select(.percent == 100) | .revisionName] | if length == 1 then .[0] else empty end' previous-service.json)"
          if [ -z "$revision" ]; then
            echo "개발 서비스의 단일 복구 revision을 확인하지 못했습니다." >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v4

      - name: 컨테이너 빌드와 게시
        uses: docker/build-push-action@v7
        with:
          context: ./core-api
          file: ./core-api/Dockerfile
          push: true
          tags: |
            ${{ steps.config.outputs.image }}:${{ github.sha }}
            ${{ steps.config.outputs.image }}:preview
          cache-from: type=gha,scope=core-api-preview
          cache-to: type=gha,mode=max,scope=core-api-preview
          provenance: true
          sbom: true

      - name: Cloud Run preview 배포
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          region: ${{ env.GCP_REGION }}
          service: ${{ env.CLOUD_RUN_SERVICE }}
          image: ${{ steps.config.outputs.image }}:${{ github.sha }}
          env_vars: |-
            SPRING_PROFILES_ACTIVE=preview
            FIREBASE_PROJECT_ID=${{ env.FIREBASE_PROJECT_ID }}
            FIREBASE_PROJECT_NUMBER=${{ env.FIREBASE_PROJECT_NUMBER }}
            BODEUL_APP_CHECK_MODE=observe
            BODEUL_SESSION_PRE_CONSULTATION_ENFORCEMENT=${{ env.BODEUL_SESSION_PRE_CONSULTATION_ENFORCEMENT }}
            BODEUL_SESSION_COMPLETION_ENFORCEMENT=${{ env.BODEUL_SESSION_COMPLETION_ENFORCEMENT }}
            BODEUL_SESSION_LEGACY_MANAGER_LOCATION_ENABLED=${{ env.BODEUL_SESSION_LEGACY_MANAGER_LOCATION_ENABLED }}
            CORE_DB_POOL_MAX=5
          env_vars_update_strategy: overwrite
          secrets: |-
            CORE_DB_JDBC_URL=bodeul-core-api-preview-db-jdbc-url:${{ env.CORE_DB_JDBC_URL_SECRET_VERSION }}
            CORE_DB_USERNAME=bodeul-core-api-preview-db-username:${{ env.CORE_DB_USERNAME_SECRET_VERSION }}
            CORE_DB_PASSWORD=bodeul-core-api-preview-db-password:${{ env.CORE_DB_PASSWORD_SECRET_VERSION }}
            KAKAO_LOCAL_REST_API_KEY=bodeul-core-api-preview-kakao-local-rest-api-key:${{ env.KAKAO_LOCAL_REST_API_KEY_SECRET_VERSION }}
          secrets_update_strategy: overwrite
          labels: |-
            environment=preview
            component=core-api
          timeout: 60s
          flags: >-
            --service-account=${{ env.CLOUD_RUN_RUNTIME_SERVICE_ACCOUNT }}
            --cpu=1
            --memory=1Gi
            --min-instances=0
            --max-instances=1
            --concurrency=8
            --port=8080
            --execution-environment=gen2
            --cpu-boost
            --ingress=all
          revision_traffic: LATEST=100

      - name: 배포 smoke test
        id: smoke
        shell: bash
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail

          if [[ -z "${SERVICE_URL}" ]]; then
            echo "Cloud Run 서비스 URL을 확인할 수 없습니다." >&2
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 8 --retry-delay 3 --retry-all-errors \
            "${SERVICE_URL}/health" > health.json
          jq -e '.status == "UP"' health.json > /dev/null

          auth_status="$(curl --silent --show-error \
            --output auth.json --write-out '%{http_code}' \
            "${SERVICE_URL}/api/auth/me")"

          if [[ "${auth_status}" != "401" ]]; then
            echo "무인증 요청이 예상한 401이 아니라 ${auth_status}을 반환했습니다." >&2
            exit 1
          fi

          jq -e '.error == "missing_authorization"' auth.json > /dev/null

          place_auth_status="$(curl --silent --show-error \
            --output place-auth.json --write-out '%{http_code}' \
            --get --data-urlencode 'query=서울대병원' \
            --data-urlencode 'category=HOSPITAL' \
            "${SERVICE_URL}/api/places/search")"

          if [[ "${place_auth_status}" != "401" ]]; then
            echo "장소 검색 무인증 요청은 401이어야 하지만 ${place_auth_status}를 반환했습니다." >&2
            exit 1
          fi

          jq -e '.error == "missing_authorization"' place-auth.json > /dev/null

      - name: 개발 배포 실패 시 기존 revision 복구
        if: failure() && steps.previous.outputs.revision != '' && (steps.deploy.outcome == 'failure' || steps.smoke.outcome == 'failure')
        env:
          PREVIOUS_REVISION: ${{ steps.previous.outputs.revision }}
        run: >-
          gcloud run services update-traffic "$CLOUD_RUN_SERVICE"
          --project "$GCP_PROJECT_ID" --region "$GCP_REGION"
          --to-revisions "${PREVIOUS_REVISION}=100" --quiet

      - name: 배포 결과 기록
        shell: bash
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "## Core API Preview 배포"
            echo
            echo "- Project: ${GCP_PROJECT_ID}"
            echo "- Region: ${GCP_REGION}"
            echo "- Service: ${CLOUD_RUN_SERVICE}"
            echo "- Revision image: ${{ steps.config.outputs.image }}:${GITHUB_SHA}"
            echo "- URL: ${SERVICE_URL}"
            echo "- 확인: health 200, 무인증 auth/place search 401"
          } >> "${GITHUB_STEP_SUMMARY}"
